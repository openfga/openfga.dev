name: Update OpenFGA Documentation

on:
  # Nightly @ 5AM UTC
  schedule:
    - cron: '0 5 * * *'
  # When triggered manually
  workflow_dispatch:

concurrency:
  group: update-openfga-documentation
  cancel-in-progress: false

jobs:
  update-docs:
    name: Update OpenFGA Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push docs update branches to the repository
      pull-requests: write # Create or update docs update pull requests
    env:
      UPDATE_BRANCH: docs/update-openfga-configuration
      UPDATE_FILE: docs-site/docs/getting-started/setup-openfga/configuration.mdx
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Cached LFS checkout
        uses: nschloe/action-cached-lfs-checkout@385a8ecc719e50b8c71af6ab01a624b486b7c3bc

      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test configuration generator offline
        run: node --test scripts/update-config-page.test.mjs

      - name: Update configuration docs
        run: npm run build:config-page

      - name: Validate generated native page
        run: node docs-site/scripts/validate-mdx.mjs "$UPDATE_FILE"

      - name: Check for documentation changes
        id: changes
        run: |
          if git diff --quiet -- "$UPDATE_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No configuration documentation changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A release can intentionally change the table, but cannot approve its own baseline.
      - name: Check independent production parity
        if: steps.changes.outputs.changed == 'true'
        id: parity
        continue-on-error: true
        run: npm run test:mintlify-content-parity

      - name: Generate token
        if: steps.changes.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - name: Import GPG key
        if: steps.changes.outputs.changed == 'true'
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure Git
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name openfga-releaser-bot
          git config user.email "${{ steps.import-gpg.outputs.email }}"

      - name: Create or update docs pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PARITY_OUTCOME: ${{ steps.parity.outcome }}
        run: |
          git checkout -B "$UPDATE_BRANCH"
          git add "$UPDATE_FILE"
          git commit -m "docs: auto-update OpenFGA configuration documentation"

          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_sha="$(git ls-remote --heads "$repo_url" "$UPDATE_BRANCH" | awk '{print $1}')"

          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/${UPDATE_BRANCH}:${remote_sha}" "$repo_url" "HEAD:${UPDATE_BRANCH}"
          else
            git push "$repo_url" "HEAD:${UPDATE_BRANCH}"
          fi

          pr_body="This draft PR updates only the generated native configuration version/table from the latest official OpenFGA release schema.

          Generator tests and native MDX validation passed. Independent production-content parity: ${PARITY_OUTCOME}.

          Independent parity expectations were NOT regenerated. Release-driven table changes (including corrected defaults) require separately sourced and reviewed baseline updates before this PR can merge. Review the release schema, preserve the hand-authored prose/examples/cards, and resolve any failing parity checks rather than accepting generated output as its own oracle."
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number')"

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "docs: auto-update OpenFGA configuration documentation" \
              --body "$pr_body"
            pr_is_draft="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [ "$pr_is_draft" != "true" ]; then
              gh pr ready "$pr_number" --undo --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --draft \
              --title "docs: auto-update OpenFGA configuration documentation" \
              --body "$pr_body"
          fi

      - name: Require independent baseline review
        if: steps.parity.outcome == 'failure'
        run: |
          echo "::error::A draft schema-update PR was created, but independent production parity failed. Review release-backed changes and update the independent baseline separately before merging; this workflow never regenerates parity expectations."
          exit 1
