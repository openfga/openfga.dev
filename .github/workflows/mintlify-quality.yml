name: Mintlify repository quality

on:
  pull_request:
    branches:
      - main
      - docs-next
    paths: &docs-paths
      - 'docs-site'
      - 'docs-site/**'
      - 'docs'
      - 'docs/**'
      - 'mintlify-native'
      - 'mintlify-native/**'
      - 'patches'
      - 'patches/**'
      - 'tests/**'
      - 'src/**'
      - 'scripts/**'
      - '.gitattributes'
      - '.gitignore'
      - '.prettierrc'
      - '.prettierignore'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'docusaurus.config.js'
      - '.github/workflows/**'
  push:
    branches:
      - docs-next
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mintlify-quality:
    name: Check repository-owned Mintlify content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run repository quality checks
        run: npm run check:mintlify
