name: Mintlify repository quality

on:
  pull_request:
    branches:
      - main
      - docs-next
    paths: &docs-paths
      - 'docs-site'
      - 'docs-site/**'
      - 'docs'
      - 'docs/**'
      - 'mintlify-native'
      - 'mintlify-native/**'
      - 'patches'
      - 'patches/**'
      - 'tests/fixtures/mintlify/**'
      - 'tests/fixtures/configuration-generator/**'
      - 'src/components/Docs'
      - 'src/components/Docs/**'
      - 'src/components/SwaggerUI'
      - 'src/components/SwaggerUI/**'
      - 'scripts/README.md'
      - 'scripts/agent-content*.mjs'
      - 'scripts/clean-agent-markdown.mjs'
      - 'scripts/deployment-verification*.mjs'
      - 'scripts/generate-legacy-api-routes.mjs'
      - 'scripts/legacy-api-routes.test.mjs'
      - 'scripts/native-deployment-fingerprint*.mjs'
      - 'scripts/native-routes*.mjs'
      - 'scripts/prepare-agent-content.mjs'
      - 'scripts/prepare-site-sitemap.mjs'
      - 'scripts/report-api-samples*.mjs'
      - 'scripts/site-boundary*.mjs'
      - 'scripts/site-sitemap*.mjs'
      - 'scripts/update-api-samples*.mjs'
      - 'scripts/update-config-page*.mjs'
      - 'scripts/validate-agent-content.mjs'
      - 'scripts/validate-site-boundary.mjs'
      - 'scripts/verify-docs-deployment.mjs'
      - '.gitattributes'
      - '.gitignore'
      - '.prettierrc'
      - '.prettierignore'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'docusaurus.config.js'
      - '.github/workflows/mintlify-quality.yml'
      - '.github/workflows/update-docs.yml'
      - '.github/workflows/update-api-samples.yml'
      - 'src/data/legacy-api-routes.json'
      - 'src/utils/legacy-api-redirect.mjs'
      - 'src/pages/api/service.tsx'
      - 'src/pages/community.mdx'
      - 'src/features/LandingPage/QuickStartSection/index.tsx'
      - 'src/theme/Root.tsx'
  push:
    branches:
      - docs-next
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mintlify-quality:
    name: Check repository-owned Mintlify content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run repository quality checks
        run: npm run check:mintlify
