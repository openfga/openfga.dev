name: Deploy documentation proxy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Worker environment
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production
      production_confirmation:
        description: For production, enter ACTIVATE OPENFGA DOCS ROUTING
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: docs-proxy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} proxy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: docs-proxy-${{ inputs.environment }}
    steps:
      - name: Check activation approval
        env:
          TARGET: ${{ inputs.environment }}
          CONFIRMATION: ${{ inputs.production_confirmation }}
        run: |
          if [ "$TARGET" = production ] && [ "$CONFIRMATION" != "ACTIVATE OPENFGA DOCS ROUTING" ]; then
            echo "::error::Production routing requires explicit confirmation and environment approval."
            exit 1
          fi

      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate proxy
        run: npm run check:docs-proxy

      - name: Verify native deployment matches the selected source before production activation
        if: inputs.environment == 'production'
        run: npm run verify:docs-origin

      - name: Deploy selected Worker environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          TARGET: ${{ inputs.environment }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the protected environment secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the protected environment variable}"
          npm exec -- wrangler deploy --config deploy/cloudflare/wrangler.json --env "$TARGET"
